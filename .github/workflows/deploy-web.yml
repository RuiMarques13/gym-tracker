# Testa a app em cada pull request e em cada push para main; só publica no GitHub Pages (main) se tudo passar.
# Endereço: https://<utilizador>.github.io/<repositório>/
name: Testar e publicar web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Testes de lógica e dados (Vitest)
        run: npm run test:core
      - name: Build
        run: npx ng build
      - name: Browser para os testes de ecrã
        run: npx playwright install --with-deps chromium
      - name: Testes de ecrã (Playwright, telemóvel 390 px, offline)
        run: npm run test:e2e
      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build (base href = nome do repositório)
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Rotas da app funcionam ao recarregar (fallback para index.html)
        run: cp www/index.html www/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
