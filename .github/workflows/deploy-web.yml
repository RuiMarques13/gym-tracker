# Testa e publica a versão web no GitHub Pages a cada push para main.
# Endereço: https://<utilizador>.github.io/<repositório>/
name: Testar e publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:core
      - name: Build (base href = nome do repositório)
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Rotas da app funcionam ao recarregar (fallback para index.html)
        run: cp www/index.html www/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
